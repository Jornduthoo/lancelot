<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <script src="/taal.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LANcelot · Toets afdrukken</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/proef.css">
</head>
<body class="ob-print">
  <div class="ob-print-bar">
    <span id="p-what">Toets</span>
    <span class="ob-niveau-tabs hidden" id="p-niveaus"></span>
    <button id="p-print">🖨 Afdrukken of opslaan als pdf</button>
    <button class="secondary" id="p-close">Sluiten</button>
  </div>
  <div id="p-papers"><article class="ob-paper ob-sheet-print"><p>Even laden…</p></article></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/niveau.js"></script>
<script src="/js/pf-kern.js"></script>
<script src="/js/pf-paper.js"></script>
<script>
// Een toets op papier, of de verbetersleutel met de antwoorden in het rood. Per niveau een eigen blad.
// Met window.KOPIE (de route /proef-kopie): de verbeterde toets van één leerling, voor de pdf in Mijn lesmap.
// Met window.OPGAVE (de route /archief-opgave): de toets zoals ze toen afgenomen werd, voor het toetsarchief.
const socket = window.KOPIE || window.OPGAVE ? null : io({ query: { role: 'host' } });
const params = new URLSearchParams(location.search);
const key = params.get('sleutel') === '1';
const file = params.get('file');
document.getElementById('p-what').textContent = key ? 'Verbetersleutel' : 'Toets voor de leerlingen';
let toets = null;

function teken(niveau) {
  const box = document.getElementById('p-papers');
  const niveaus = PfKern.niveausVan(toets);
  const multi = niveaus.length > 1;
  const kies = niveau === 'alle' ? niveaus : [niveaus.includes(niveau) ? niveau : 'schildknaap'];
  const bar = document.getElementById('p-niveaus');
  bar.classList.toggle('hidden', !multi);
  if (multi) {
    bar.innerHTML = [...niveaus.map(n => [n, Niveau.label(n)]), ['alle', niveaus.length === 2 ? 'Allebei' : 'Alle drie']]
      .map(([n, label]) => `<button type="button" class="secondary${n === (niveau === 'alle' ? 'alle' : kies[0]) ? ' on' : ''}" data-niveau="${n}">${label}</button>`).join('');
    for (const b of bar.querySelectorAll('button')) b.addEventListener('click', () => teken(b.dataset.niveau));
  }
  box.innerHTML = '';
  for (const n of kies) {
    const lijst = PfKern.lijstVoor(toets, n);
    const v = PfKern.studentView(toets, lijst);
    const sleutel = {};
    const zones = {};
    if (key) for (const { id, q } of PfKern.vragenVan(lijst)) {
      sleutel[id] = q.type === 'blad' ? PfKern.veldSleutel(q) : PfKern.oplossing(q) || ' ';
      if (q.type === 'aanduiden') zones[id] = q.zones;
      else if (q.type === 'markeren' && (q.per || q.inBron || q.kleuren || q.aantal)) zones[id] = PfKern.markeerSleutel(q);
      else if (q.type === 'blad') zones[id] = q.velden;
    }
    const paper = document.createElement('article');
    paper.className = 'ob-paper ob-sheet-print pf-paper pf-print';
    paper.innerHTML = `<header class="ob-head"><h1>${PfPaper.esc(toets.title)}${multi ? ` <span class="ob-niveau-tag ${n}">${Niveau.label(n)}</span>` : ''}${key ? ' <span class="ob-key-tag">verbetersleutel</span>' : ''}</h1>
      <div class="ob-meta"><span>Naam: <i></i></span><span>Klas: <i class="short"></i></span><span>Datum: <i class="short"></i></span><span>Punten: <i class="short"></i> / ${PfPaper.nl(v.totaal)}</span></div>
      ${toets.intro ? `<p class="pf-intro-print">${PfPaper.esc(toets.intro)}</p>` : ''}</header><div class="pf-vragen-print"></div>`;
    box.appendChild(paper);
    PfPaper.render(paper.querySelector('.pf-vragen-print'), v.pages, { mode: 'print', nummer: true, sleutel: key ? sleutel : null, zones });
  }
  document.title = `${toets.title}${multi && niveau !== 'alle' ? ` (${Niveau.NAMES[kies[0]]})` : ''}${key ? ' (verbetersleutel)' : ''}`;
  const url = new URL(location.href);
  url.searchParams.set('niveau', niveau === 'alle' ? 'alle' : kies[0]);
  history.replaceState(null, '', url);
}

// De kopie van één leerling: zijn antwoorden, de punten, ✔/✘ per vakje en de juiste antwoorden.
function kopie(d) {
  const lijst = PfKern.lijstVoor(d.toets, d.niveau);
  const v = PfKern.studentView(d.toets, lijst);
  const sleutel = {};
  const zones = {};
  for (const { id, q } of PfKern.vragenVan(lijst)) {
    sleutel[id] = q.type === 'blad' ? PfKern.veldSleutel(q) : PfKern.oplossing(q);
    if (q.type === 'aanduiden') zones[id] = q.zones;
    else if (q.type === 'markeren' && (q.per || q.inBron || q.kleuren || q.aantal)) zones[id] = PfKern.markeerSleutel(q);
    else if (q.type === 'blad') zones[id] = q.velden;
  }
  const multi = PfKern.niveausVan(d.toets).length > 1;
  const datum = new Date(d.datum).toLocaleDateString('nl-BE', { dateStyle: 'long' });
  const box = document.getElementById('p-papers');
  box.innerHTML = '';
  const paper = document.createElement('article');
  paper.className = 'ob-paper ob-sheet-print pf-paper pf-print pf-kopie';
  paper.innerHTML = `<header class="ob-head"><h1>${PfPaper.esc(d.title)}${multi ? ` <span class="ob-niveau-tag ${d.niveau}">${Niveau.label(d.niveau)}</span>` : ''}</h1>
    <div class="ob-meta"><span>Naam: <b>${PfPaper.esc(d.naam)}</b></span><span>Datum: <b>${PfPaper.esc(datum)}</b></span><span>Punten: <b>${PfPaper.nl(d.stand.punten)} / ${PfPaper.nl(d.stand.max)}</b></span></div></header><div class="pf-vragen-print"></div>`;
  box.appendChild(paper);
  PfPaper.render(paper.querySelector('.pf-vragen-print'), v.pages, { mode: 'view', nummer: true, answers: d.antwoorden || {}, sleutel, zones, punten: d.punten, vakken: d.vakken });
  // Een blad uit de pdf net iets kleiner, zodat het samen met de naam en de punten op één A4 past.
  for (const vel of paper.querySelectorAll('.pf-blad-vel')) vel.style.maxWidth = `${Math.round(225 / (Number(vel.dataset.verhouding) || 1.414))}mm`;
  document.title = `${d.naam} · ${d.title}`;
  document.documentElement.style.background = '#fff'; // geen donkere strook onderaan de pdf
  document.getElementById('p-what').textContent = `${d.naam} · ${d.title}`;
}

if (window.KOPIE) kopie(window.KOPIE);
else if (window.OPGAVE) {
  toets = window.OPGAVE.toets;
  teken('alle');
  document.documentElement.style.background = '#fff';
} else socket.emit('pf-open', file, res => {
  if (res.error) return (document.getElementById('p-papers').textContent = res.error);
  toets = res.toets;
  teken(params.get('niveau') || 'schildknaap');
});
document.getElementById('p-print').addEventListener('click', () => window.print());
// Met bekijk=1 staat het blad in het 👁 Bekijken-venster van de lijst: afdrukken en sluiten gebeurt daar niet.
if (params.get('bekijk') === '1') for (const id of ['p-print', 'p-close']) document.getElementById(id).classList.add('hidden');
document.getElementById('p-close').addEventListener('click', () => window.close());
</script>
</body>
</html>
