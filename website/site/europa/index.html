<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font-family:system-ui,sans-serif;font-size:14px}[hidden]{display:none!important}</style><meta name="robots" content="noindex, nofollow"><title>Tijl in Europa</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: speelbord met grote kaart (zee + land) en een zijpaneel met de vraag; menu als kaartentafel met spelmodi */
:root{
  --bg:#e6f3f9; --panel:#ffffff; --ink:#10324a; --muted:#5b7a8e; --line:#c9dfea;
  --sea:#b9def0; --land:#fdfefe; --landline:#86aabd; --bgland:#dfe9ee;
  --sun:#ffc23d; --pop:#ff4f87; --ok:#21a96a; --bad:#ec4b36; --pick:#3d7bff;
  --sunink:#3b2a00; --shadow:0 2px 0 rgba(16,50,74,.12),0 8px 24px rgba(16,50,74,.08);
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1a26; --panel:#122a3b; --ink:#e7f3fa; --muted:#93b0c2; --line:#24445a;
  --sea:#0b2233; --land:#3d6886; --landline:#7aa3bd; --bgland:#1c3546;
  --sun:#ffc94f; --pop:#ff6b9a; --ok:#35c784; --bad:#ff6450; --pick:#6a9bff;
  --shadow:0 2px 0 rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1a26; --panel:#122a3b; --ink:#e7f3fa; --muted:#93b0c2; --line:#24445a;
  --sea:#0b2233; --land:#3d6886; --landline:#7aa3bd; --bgland:#1c3546;
  --sun:#ffc94f; --pop:#ff6b9a; --ok:#35c784; --bad:#ff6450; --pick:#6a9bff;
  --shadow:0 2px 0 rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 32px;display:flex;flex-direction:column;gap:16px}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo .stars{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#1d4fd8;position:relative}
.logo .stars i{position:absolute;width:5px;height:5px;background:#ffd200;border-radius:1px;transform:rotate(45deg)}
.logo b{color:var(--pop)}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:var(--shadow);font-weight:800;font-variant-numeric:tabular-nums}
.chip .lv{background:var(--sun);color:var(--sunink);font-family:var(--f-display);border-radius:999px;min-width:30px;height:30px;display:grid;place-items:center;padding:0 6px}
.xpbar{width:110px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pop));width:0;transition:width .6s}
.chip.small{padding:6px 12px}
.iconbtn{background:var(--panel);box-shadow:var(--shadow);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;font-weight:800}

/* HOME */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.card{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.hello h1{font-size:clamp(28px,4.4vw,44px)}
.hello p{color:var(--muted);margin:.5em 0 0;max-width:52ch}
.prog{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill{border-radius:14px;padding:10px 14px;background:var(--bg);min-width:96px}
.pill b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.pill span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.opts{display:flex;flex-direction:column;gap:12px}
.opts h2{font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;border-radius:999px;background:var(--bg);font-weight:800;font-size:14px;border:2px solid transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.optlbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:6px}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sectionhead h2{font-size:24px}
.sectionhead p{margin:0;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mode{text-align:left;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s;position:relative;min-width:0}
.mode:hover{transform:translateY(-3px) rotate(-.4deg)}
.mode:active{transform:translateY(1px)}
.mode .art{height:92px;border-radius:14px;background:var(--sea);display:grid;place-items:center;overflow:hidden;position:relative}
.mode .art svg{width:80%;height:80%}
.mode .art svg path{fill:var(--land);stroke:var(--landline);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mode .art img{height:62px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mode .art .big{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--ink)}
.mode h3{font-size:19px}
.mode p{margin:0;font-size:14px;color:var(--muted)}
.mode .tag{position:absolute;top:22px;right:22px;background:var(--pop);color:#fff;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 8px}
.mode .best{font-size:12px;font-weight:800;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--bg);opacity:.5}
.badge.on{opacity:1;background:var(--panel);box-shadow:var(--shadow)}
.medal{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#3b2a00;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc23d 55%,#d99500);font-size:16px}
.badge:not(.on) .medal{background:var(--line);color:var(--muted)}
.badge b{display:block;font-size:14px;line-height:1.2}
.badge div span{font-size:12px;color:var(--muted);line-height:1.2;display:block}

/* GAME */
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.mapbox{position:relative;background:var(--sea);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);touch-action:none;aspect-ratio:1000/860;max-width:100%}
.mapbox svg{display:block;width:100%;height:100%;user-select:none}
.mapbox .bg{fill:var(--bgland);stroke:var(--landline);stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.mapbox .c{fill:var(--land);stroke:var(--landline);stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill .2s}
.mapbox .c.off{fill:var(--bgland);pointer-events:none}
.mapbox.clickable .c:not(.off):hover{fill:#ffe9a6}
.mapbox .c.hl{fill:var(--sun);animation:pulse 1.2s ease-in-out infinite}
.mapbox .c.good{fill:var(--ok);animation:none}
.mapbox .c.badc{fill:var(--bad);animation:none}
.mapbox .c.m1{fill:#ffe1b0}.mapbox .c.m2{fill:#bfe8a8}.mapbox .c.m3{fill:#6fcf8e}
.mapbox .dot{fill:var(--land);stroke:var(--landline);stroke-width:1.2;vector-effect:non-scaling-stroke}
.mapbox .dot.off{display:none}
.mapbox .dot.hl{fill:var(--sun)}.mapbox .dot.good{fill:var(--ok)}.mapbox .dot.badc{fill:var(--bad)}
.mapbox .cap{fill:var(--pop);stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.mapbox .lbl{font-family:var(--f-display);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
@keyframes pulse{50%{fill:#ffdf85}}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);font-weight:800;font-size:20px;line-height:1}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);font-weight:800;padding:8px 14px;border-radius:999px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:70px;background:var(--panel);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat.fire b{color:var(--pop)}
.timer{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--pop);transition:width .25s linear}
.q{position:relative}
.q .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.q h2{font-size:26px;margin-top:4px}
.q h2 em{font-style:normal;color:var(--pop)}
.q .flagbig{display:block;width:100%;max-width:240px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.18);margin:12px auto 2px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ans{background:var(--bg);border-radius:14px;padding:12px 10px;font-weight:800;font-size:16px;border:2px solid var(--line);transition:transform .1s,background .15s;min-width:0;overflow-wrap:anywhere}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pick)}
.ans:disabled{cursor:default}
.ans.good{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.badc{background:var(--bad);border-color:var(--bad);color:#fff}
.ans.dim{opacity:.4}
.ans img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.ans.flagans{padding:6px}
.typebox{display:flex;gap:8px;margin-top:14px}
.typebox input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:18px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{background:var(--ink);color:var(--panel);border-radius:14px;padding:12px 18px;font-weight:800;font-family:var(--f-display);font-size:17px;letter-spacing:.2px}
.btn.sun{background:var(--sun);color:var(--sunink)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hintline{font-size:14px;color:var(--muted);margin-top:10px}
.fb{border-radius:16px;padding:12px 14px;font-weight:700;display:flex;gap:12px;align-items:center}
.fb.good{background:color-mix(in srgb,var(--ok) 18%,var(--panel))}
.fb.badc{background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.fb img{width:54px;border-radius:5px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.fb .big{font-family:var(--f-display);font-size:20px;display:block}
.fb small{font-weight:700;color:var(--muted)}
.hearts{display:flex;gap:4px;font-size:20px}
.heart{width:22px;height:20px;position:relative;display:inline-block}
.heart::before,.heart::after{content:"";position:absolute;top:0;width:12px;height:19px;border-radius:12px 12px 0 0;background:var(--pop)}
.heart::before{left:10px;transform:rotate(-45deg);transform-origin:0 100%}
.heart::after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
.heart.lost::before,.heart.lost::after{background:var(--line)}
.pop{position:absolute;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--ok);pointer-events:none;animation:floatup 1s ease-out forwards;z-index:5}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-60px) scale(1.2)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.combo{position:absolute;right:16px;top:-10px;background:var(--pop);color:#fff;font-family:var(--f-display);font-weight:700;border-radius:999px;padding:4px 10px;transform:rotate(6deg);font-size:15px}

/* RESULT */
.result{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%}
.result .card{text-align:center}
.bigstars{display:flex;justify-content:center;gap:10px;margin:8px 0}
.bstar{width:56px;height:56px;background:var(--line);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.bstar.on{background:var(--sun);animation:starpop .5s backwards}
.bstar.on:nth-child(2){animation-delay:.2s}.bstar.on:nth-child(3){animation-delay:.4s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.result .score{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;text-align:left}
.mist div{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px}
.mist img{width:40px;border-radius:4px}
.mist b{display:block;font-size:14px}.mist span{font-size:13px;color:var(--muted)}
.lvup{background:var(--sun);color:var(--sunink);border-radius:16px;padding:12px;font-family:var(--f-display);font-size:20px;font-weight:700}

/* ATLAS */
.info{display:flex;flex-direction:column;gap:10px}
.info img{width:100%;max-width:260px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.mrow{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--landline)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* ===== Sterkere game-look: stickerstijl met dikke randen ===== */
:root{--edge:#10324a;--royal:#1f43c7;--royal2:#3a6bff;--c1:#ff5a5f;--c2:#2fb36d;--c3:#ffc23d;--c4:#3a6bff;--c5:#ff7ac6;--c6:#8f5bff;--c7:#ff9a3c;--c8:#1fb8c9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge:#020a10}}
:root[data-theme="dark"]{--edge:#020a10}
body{background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--royal2) 22%,transparent) 1.5px,transparent 0) 0 0/22px 22px,var(--bg)}
.chip,.iconbtn,.card,.mode,.stat,.mapbox,.zoom button,.btn,.ans,.badge.on{border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge)}
.btn,.ans,.mode,.iconbtn,.zoom button{transition:transform .08s,box-shadow .08s}
.btn:active,.ans:active:not(:disabled),.mode:active,.iconbtn:active,.zoom button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn{font-size:18px;padding:12px 20px}
.btn.ghost{background:var(--panel)}
.btn.sun{background:var(--sun)}
.logo{font-size:28px}
/* banner */
.banner{position:relative;background:linear-gradient(135deg,var(--royal),var(--royal2));color:#fff;border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge);border-radius:28px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;overflow:hidden}
.banner::before{content:"";position:absolute;right:-60px;top:50%;width:380px;height:380px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%)}
.banner .ring{position:absolute;right:30px;top:50%;width:300px;height:300px;transform:translateY(-50%);pointer-events:none;animation:spin 60s linear infinite}
.banner .ring i{position:absolute;width:16px;height:16px;background:#ffd200;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.banner h1{font-size:clamp(38px,7vw,72px);letter-spacing:-1.5px;color:#fff;text-shadow:0 4px 0 var(--edge)}
.banner h1 b{color:var(--sun)}
.banner p{max-width:46ch;font-size:17px;color:#e3ebff;margin:.6em 0 1em}
.banner .row{position:relative;z-index:1}
.banner .prog{position:relative;z-index:1}
.banner .pill{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);color:#fff}
.banner .pill span{color:#cfdcff}
.banner .tijl-l{position:relative;z-index:1}
.bigplay{font-size:22px;padding:14px 26px}
/* Tijl */
.tijl{display:flex;align-items:center;gap:10px}
.tijl-fig{flex:none;filter:drop-shadow(0 4px 0 rgba(2,10,16,.35))}
.tijl-l .tijl-fig{width:230px}
.tijl-l{flex-direction:column-reverse}
.tijl-s .tijl-fig{width:76px}
.tijl-m .tijl-fig{width:140px}
.tijl-fig svg{display:block;width:100%;height:auto}
.bubble{position:relative;background:#fff;color:#10324a;border:3px solid var(--edge);border-radius:18px;padding:10px 14px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:0 4px 0 var(--edge);min-width:0}
.tijl-s .bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid var(--edge);border-left:0}
.tijl-s .bubble::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:9px solid #fff;border-left:0}
.tijl-l .bubble{font-size:17px;max-width:250px;text-align:center}
.tijl-l .bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top:12px solid #fff;border-bottom:0}
.tijl .bubble{animation:bubin .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes bubin{from{transform:scale(.6);opacity:0}}
.tijl-svg .tj-cap{transform-origin:64px 60px;animation:capwob 3s ease-in-out infinite}
@keyframes capwob{50%{transform:rotate(-4deg)}}
.tijl-svg .owl-eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.mood-juich .tijl-fig,.mood-blij.hop .tijl-fig{animation:hop .5s ease-out 2}
@keyframes hop{40%{transform:translateY(-14px) rotate(-6deg)}}
.mood-oeps .tijl-fig{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.tijlbox{background:var(--panel);border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);border-radius:20px;padding:8px 12px}
/* modes */
.mode{border-radius:22px}
.mode:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 9px 0 var(--edge)}
.mode .art{border:3px solid var(--edge);height:100px}
.mode .art .big{color:#fff;text-shadow:0 3px 0 var(--edge);font-size:34px}
.mode .art svg path{fill:#fff;stroke:var(--edge);stroke-width:2.5}
.mode .art img{border:3px solid var(--edge)}
.mode .tag{border:2px solid var(--edge);background:var(--sun);color:var(--sunink);top:20px;right:20px}
.mode h3{font-size:21px}
.modes .mode:nth-child(8n+1) .art{background:var(--c4)}
.modes .mode:nth-child(8n+2) .art{background:var(--c1)}
.modes .mode:nth-child(8n+3) .art{background:var(--c2)}
.modes .mode:nth-child(8n+4) .art{background:var(--c6)}
.modes .mode:nth-child(8n+5) .art{background:var(--c7)}
.modes .mode:nth-child(8n+6) .art{background:var(--c8)}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const SVGNS='http://www.w3.org/2000/svg';
const sv=(tag,attrs={})=>{const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const BY={};COUNTRIES.forEach(c=>BY[c.iso]=c);

// logo: ring of stars
(()=>{const s=$('#logostars');for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const t=el('i');t.style.left=(16.5+Math.cos(a)*12)+'px';t.style.top=(16.5+Math.sin(a)*12)+'px';s.append(t)}})();

const REGIONS={alles:'Heel Europa',west:'West',noord:'Noord',midden:'Midden',zuid:'Zuid',balkan:'Balkan',oost:'Oost'};
const ALT={
 'Wenen':['wien','vienna'],'Brussel':['brussels','bruxelles'],'Praag':['praha','prague'],'Kopenhagen':['kobenhavn','copenhagen'],
 'Parijs':['paris'],'Berlijn':['berlin'],'Athene':['athens','athina'],'Boedapest':['budapest'],'Reykjavik':['reykjavík'],
 'Rome':['roma'],'Pristina':['prishtina','prishtine'],'Luxemburg':['luxemburg stad','luxembourg'],'Chisinau':['kisjinev','kishinev'],
 'Warschau':['warszawa','warsaw'],'Lissabon':['lisboa','lisbon'],'Boekarest':['bucuresti','bucharest'],'Moskou':['moskva','moscow'],
 'Belgrado':['beograd','belgrade'],'Kyiv':['kiev','kiëv','kyjiv'],'Londen':['london'],'Vaticaanstad':['vatican','vaticaan','vatikaanstad'],
 'Tirana':['tirane'],'Sofia':['sofija'],'Nicosia':['lefkosia'],'Valletta':['la valletta'],'Skopje':[],'Bern':[],'Vilnius':[],'Tallinn':[],'Riga':[]
};
const LEVELS=['Toerist','Dagjesmens','Backpacker','Treinreiziger','Reisleider','Grensganger','Kaartlezer','Ontdekker','Cartograaf','Atlas-held','Europa-kenner','Wereldwonder'];
const xpFor=l=>Math.round(120*l*(l+1)/2*1.15);

// ---------- opslag ----------
const KEY='tijl-in-europa-v1';
let S={xp:0,coins:0,games:0,best:{},mastery:{},badges:[],sound:true,opts:{region:'alles',rounds:10,level:'normaal'},streakBest:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const mastery=(iso)=>S.mastery[iso]||(S.mastery[iso]={loc:0,cap:0,flag:0});
function levelOf(xp){let l=1;while(xp>=xpFor(l))l++;return l}
function updateHud(){const l=levelOf(S.xp);$('#hudLv').textContent=l;$('#hudTitle').textContent=LEVELS[Math.min(l-1,LEVELS.length-1)];
  const lo=l>1?xpFor(l-1):0,hi=xpFor(l);$('#hudXp').style.width=Math.min(100,(S.xp-lo)/(hi-lo)*100)+'%';
  $('#hudCoins').textContent=S.coins+' munten';$('#soundBtn').style.opacity=S.sound?1:.4}

// ---------- geluid ----------
let AC=null;
function tone(freq,dur=.12,type='sine',vol=.15,delay=0){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur)}catch(e){}}
const sfx={good:s=>{const b=523+Math.min(s,12)*30;tone(b,.1,'triangle');tone(b*1.5,.16,'triangle',.15,.08)},
 bad:()=>{tone(220,.18,'sawtooth',.08);tone(160,.25,'sawtooth',.08,.12)},
 click:()=>tone(700,.04,'square',.04),
 win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.12)),
 bell:()=>{},
 lvl:()=>[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,.18,'square',.07,i*.09))};
function bells(){[1568,2093,1760,2349].forEach((f,i)=>tone(f,.25,'sine',.06,i*.07))}
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();updateHud();sfx.click()};

// ---------- confetti ----------
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[];
function confetti(n=140){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;cv.width=innerWidth;cv.height=innerHeight;const cols=['#ffc23d','#ff4f87','#21a96a','#3d7bff','#1d4fd8'];
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,life:120});
 if(parts.length===n)requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}

// ---------- kaart ----------
function makeMap(opts={}){
  const box=el('div',{class:'mapbox'});
  const svg=sv('svg',{viewBox:`0 0 ${MAP_W} ${MAP_H}`,role:'img','aria-label':'Kaart van Europa'});
  const g=sv('g');svg.append(g);
  BG.forEach(d=>g.append(sv('path',{d,class:'bg'})));
  const paths={},dots={};
  COUNTRIES.forEach(c=>{const p=sv('path',{d:c.d,class:'c','data-iso':c.iso});paths[c.iso]=p;g.append(p)});
  // klikbare rondjes voor dwergstaten
  COUNTRIES.filter(c=>c.area<20).forEach(c=>{const d=sv('circle',{cx:c.iso==='va'?c.cx-4:c.cx,cy:c.cy,r:6,class:'dot','data-iso':c.iso});dots[c.iso]=d;g.append(d)});
  const capLayer=sv('g'),lblLayer=sv('g');g.append(capLayer,lblLayer);
  const toast=el('div',{class:'toast'});
  const zoom=el('div',{class:'zoom'},el('button',{'aria-label':'Inzoomen',onclick:()=>zoomBy(.7)},'+'),el('button',{'aria-label':'Uitzoomen',onclick:()=>zoomBy(1.4)},'−'),el('button',{'aria-label':'Hele kaart',onclick:()=>reset(true)},'⤢'));
  box.append(svg,zoom,toast);
  let vb={x:0,y:0,w:MAP_W,h:MAP_H},home={...vb};
  const apply=()=>{svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);const k=MAP_W/vb.w;
    Object.values(dots).forEach(d=>d.setAttribute('r',Math.max(2.2,6/Math.sqrt(k))));
    lblLayer.querySelectorAll('text').forEach(t=>t.setAttribute('font-size',Math.max(9,22/Math.sqrt(k))));
    capLayer.querySelectorAll('circle').forEach(t=>t.setAttribute('r',Math.max(2.5,7/Math.sqrt(k))))};
  const clamp=()=>{vb.w=Math.min(MAP_W,Math.max(60,vb.w));vb.h=vb.w*MAP_H/MAP_W;vb.x=Math.min(MAP_W-vb.w,Math.max(0,vb.x));vb.y=Math.min(MAP_H-vb.h,Math.max(0,vb.y))};
  let anim=null;
  function animateTo(t){cancelAnimationFrame(anim);const f={...vb};let s=null;const step=ts=>{s=s||ts;const p=Math.min(1,(ts-s)/450),e=1-Math.pow(1-p,3);for(const k of['x','y','w','h'])vb[k]=f[k]+(t[k]-f[k])*e;apply();if(p<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
  function zoomBy(f,cxp=vb.x+vb.w/2,cyp=vb.y+vb.h/2,instant){const t={w:vb.w*f};t.h=t.w*MAP_H/MAP_W;t.x=cxp-(cxp-vb.x)*f;t.y=cyp-(cyp-vb.y)*f;const o={...vb};Object.assign(vb,t);clamp();const n={...vb};if(instant){apply();return}Object.assign(vb,o);animateTo(n)}
  function reset(animated){const t={...home};animated?animateTo(t):(vb={...t},apply())}
  function fitTo(isos,pad=40,setHome=true){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    isos.forEach(i=>{const b=(dots[i]&&BY[i].area<20)?{x:BY[i].cx-8,y:BY[i].cy-8,width:16,height:16}:paths[i].getBBox();
